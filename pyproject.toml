[project]
name = "animind-voice"
version = "0.1.0"
description = "scene-spec 的旁白流水线：分句合成、Whisper 书签对齐、回听检查、成片审片"
readme = "README.md"
license = "MIT"
authors = [{ name = "Boxi Yu" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",  # trace.py 用 yaml.compose 取场景文件的行号
  "scene-spec @ git+https://github.com/animind-ai/scene-spec@v0.1.0",
  "zh-math-reading @ git+https://github.com/animind-ai/zh-math-reading@v0.1.0",
]

[project.optional-dependencies]
align = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
align-cuda = ["faster-whisper>=1.1"]  # Linux / CUDA；1.1 起有 large-v3-turbo
vertex = ["google-genai>=1.0"]
review = ["google-genai>=1.0"]

[project.scripts]
animind-voice = "voice.cli:main"

[tool.uv.sources]
scene-spec = { path = "../scene-spec", editable = true }
zh-math-reading = { path = "../zh-math-reading", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# 同级仓库按 git tag 依赖（未发布到 PyPI）；本地开发仍走 [tool.uv.sources] 的相对路径
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
