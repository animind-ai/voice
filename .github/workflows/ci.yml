name: ci
on:
  push:
    branches: [main]
  pull_request:

# voice 以可编辑路径依赖同级目录的 scene-spec 和 zh-math-reading，所以几个仓库并排检出
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: voice
    steps:
      - uses: actions/checkout@v4
        with:
          path: voice
      - uses: actions/checkout@v4
        with:
          repository: animind-ai/scene-spec
          path: scene-spec
      - uses: actions/checkout@v4
        with:
          repository: animind-ai/zh-math-reading
          path: zh-math-reading
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra review   # 不装 align：mlx-whisper 只能在 Apple 芯片上跑。review 带上 google-genai，测视频 Part 的字段；审片用例本身不联网
      - run: uvx ruff check .
      - run: uv run pytest -q
